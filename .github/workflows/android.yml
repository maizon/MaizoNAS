name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Testar e gerar MaizonNAS Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar SDK no runner do GitHub
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes dos protocolos, analise Android e APK
        run: bash ./gradlew --no-daemon :core:test :app:lintDebug :app:assembleDebug
      - name: Preparar download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MaizonNAS-Android-debug.apk
          cd dist
          sha256sum MaizonNAS-Android-debug.apk > SHA256SUMS
      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: MaizonNAS-Android-debug
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Publicar relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-testes
          path: |
            core/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
